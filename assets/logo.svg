<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Renear app icon: a sound wave turning into lines of minutes. Copy to static/icon.svg
       and site/icon.svg, then regenerate the platform icons with: npx tauri icon app-icon.svg -->
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#0a0a0a"/>
  <!-- hairline edge so the tile stays visible on dark taskbars -->
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="8"/>
  <!-- sound wave -->
  <rect x="236" y="412" width="48" height="200" rx="24" fill="#ffffff"/>
  <rect x="316" y="312" width="48" height="400" rx="24" fill="#ffffff"/>
  <rect x="396" y="372" width="48" height="280" rx="24" fill="#ffffff"/>
  <!-- lines of text -->
  <rect x="488" y="400" width="300" height="48" rx="24" fill="url(#line)"/>
  <rect x="488" y="488" width="248" height="48" rx="24" fill="#ffffff"/>
  <rect x="488" y="576" width="176" height="48" rx="24" fill="#ffffff" fill-opacity="0.55"/>
</svg>
